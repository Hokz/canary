---
name: autofix.ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "data-canary/**"
      - "data-otservbr-global/**"
      - "cmake/**"
      - "docker/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=ACMR -z --name-only "${BASE_SHA}" "${HEAD_SHA}" > all_changed.txt

          : > cpp_files.txt
          : > lua_files.txt
          : > cmake_files.txt
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              src/protobuf/*) continue ;;
            esac
            case "$f" in
              *.cpp|*.cc|*.cxx|*.hpp|*.h|*.hxx) printf '%s\0' "$f" >> cpp_files.txt ;;
              *.lua) printf '%s\0' "$f" >> lua_files.txt ;;
              CMakeLists.txt|*.cmake) printf '%s\0' "$f" >> cmake_files.txt ;;
            esac
          done < all_changed.txt

          has_cpp=false; [ -s cpp_files.txt ] && has_cpp=true
          has_lua=false; [ -s lua_files.txt ] && has_lua=true
          has_cmake=false; [ -s cmake_files.txt ] && has_cmake=true
          echo "has_cpp=${has_cpp}" >> "$GITHUB_OUTPUT"
          echo "has_lua=${has_lua}" >> "$GITHUB_OUTPUT"
          echo "has_cmake=${has_cmake}" >> "$GITHUB_OUTPUT"

      - name: Run clang-format on changed files
        if: steps.changed-files.outputs.has_cpp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 install -y clang-format-17
          xargs -0 -a cpp_files.txt clang-format-17 -i --

      - name: Install StyLua
        if: steps.changed-files.outputs.has_lua == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -o stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua
          stylua --version

      - name: Run StyLua on changed files
        if: steps.changed-files.outputs.has_lua == 'true'
        shell: bash
        run: xargs -0 -a lua_files.txt stylua --

      - name: Run cmake-format on changed files
        if: steps.changed-files.outputs.has_cmake == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pip install cmakelang PyYAML
          xargs -0 -a cmake_files.txt cmake-format -i --

      - name: Apply formatting with autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: "style: auto-formatting (clang/stylua/cmake)"
